<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero — Scent Gallery</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="hero" aria-label="Hero">
  <div class="container hero__inner">

    <!-- Left: Content -->
    <div class="hero__content">
      <span class="hero__overline">Fragrance Decants</span>
      <h1 class="hero__headline">Try before<br>you commit.</h1>
      <p class="hero__sub">Luxury fragrance samples from 1ml. Discover what's yours before spending hundreds on a full bottle.</p>
      <div class="hero__actions">
        <a href="#" class="btn-primary">Shop the Collection</a>
        <a href="#" class="btn-ghost">How it works</a>
      </div>
    </div>

    <!-- Right: Product bottles -->
    <div class="hero__visual" aria-hidden="true">
      <div class="hero__bottles">
        <img
          class="hero__bottle"
          src="../../brand-assets/bottles/1ML.avif"
          alt="1ml fragrance decant bottle"
          loading="eager"
        >
        <img
          class="hero__bottle"
          src="../../brand-assets/bottles/5ML.avif"
          alt="5ml fragrance decant bottle"
          loading="eager"
        >
        <img
          class="hero__bottle"
          src="../../brand-assets/bottles/Pressurized-10ML.avif"
          alt="10ml pressurized fragrance decant bottle"
          loading="eager"
        >
        <img
          class="hero__bottle"
          src="../../brand-assets/bottles/10ML-Basic.avif"
          alt="10ml basic fragrance decant bottle"
          loading="eager"
        >
      </div>
    </div>

  </div>
</section>

</body>
</html>
