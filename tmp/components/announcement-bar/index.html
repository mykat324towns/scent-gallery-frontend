<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcement Bar — Scent Gallery</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="announcement-bar" id="announcement-bar" role="banner" aria-label="Promotional announcement">
  <div class="container announcement-bar__inner">
    <p class="announcement-bar__text">
      Use code <strong>FIRST10</strong> for 10% off your first order
    </p>
    <button
      class="announcement-bar__dismiss"
      aria-label="Dismiss announcement"
      onclick="document.getElementById('announcement-bar').classList.add('is-hidden')"
    >&#215;</button>
  </div>
</div>

</body>
</html>
