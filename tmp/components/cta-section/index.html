<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CTA Section — Scent Gallery</title>
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="cta-section" aria-label="Call to action">
  <div class="container">
    <div class="cta-section__inner reveal">
      <span class="cta-section__overline">Start Small</span>
      <h2 class="cta-section__title">Not sure where to start?</h2>
      <p class="cta-section__body">Every order ships with a sample recommendation based on your picks. Discover your next signature scent without the full-bottle risk.</p>
      <div class="cta-section__actions">
        <a href="#" class="btn-primary--white">Build Your Sample Set</a>
        <a href="#" class="btn-ghost--white">View All Fragrances</a>
      </div>
    </div>
  </div>
</section>

<script>
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-visible'); observer.unobserve(e.target); } });
  }, { threshold: 0.15 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
